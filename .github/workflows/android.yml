name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release asset

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Waypoint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Rolling release so the newest APK has a direct, phone-friendly download link.
      - name: Publish APK to the latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Waypoint.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk Waypoint.apk --prerelease --target "$GITHUB_SHA" \
            --title "Waypoint Android (latest build)" \
            --notes "Debug build of commit $GITHUB_SHA. Download Waypoint.apk on your phone and tap it to install."
